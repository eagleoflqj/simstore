name: Build SimStore

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install SVG renderer
        run: brew install librsvg
      - name: Build
        run: |
          cmake --preset release
          cmake --build --preset release
      - name: Package
        run: tar -cjf build/SimStore.app.tar.bz2 -C build/release SimStore.app
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/SimStore.app.tar.bz2
          archive: false
          if-no-files-found: error
      - name: Check Swift formatting
        run: xcrun swift-format lint --recursive --strict src tests
      - name: Test
        run: ctest --preset release --verbose

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SimStore.app.tar.bz2
          path: build
      - name: Update nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf -v notes '%s\n\n```sh\n%s\n```\n\n%s' \
            'Execute the command in Terminal to install this version:' \
            "rm -rf /tmp/SimStore.app && curl -fL https://github.com/$GH_REPO/releases/download/latest/SimStore.app.tar.bz2 -o /tmp/SimStore.app.tar.bz2 && rm -rf ~/Applications/SimStore.app && mkdir -p ~/Applications && tar -xjf /tmp/SimStore.app.tar.bz2 -C ~/Applications" \
            'Do NOT download by clicking the link below.'
          if gh release view latest >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release upload latest build/SimStore.app.tar.bz2 --clobber
            gh release edit latest --title "Nightly build" --notes "$notes" \
              --target "$GITHUB_SHA" --latest
          else
            gh release create latest build/SimStore.app.tar.bz2 \
              --target "$GITHUB_SHA" --title "Nightly build" --notes "$notes" --latest
          fi
